name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Set the BLOOMDESK_URL repository variable once the web app is hosted; without it the app asks for the address.
      - run: ./gradlew assembleDebug -PbloomdeskUrl="${{ vars.BLOOMDESK_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BloomDesk-debug-apk
          path: android/build/outputs/apk/debug/*.apk
